name: Stand aktualisieren

on:
  schedule:
    # Zeiten sind UTC. 05:10 und 21:10 UTC = 07:10 und 23:10 deutscher Sommerzeit.
    - cron: "10 5 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:        # erlaubt den Start von Hand ueber den Actions-Reiter
  push:
    paths:
      - "data/manual.json"  # nach jeder Vorlagen-Aenderung sofort neu rechnen
      - "scripts/update.py"

permissions:
  contents: write

concurrency:
  group: stand
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten abrufen und rechnen
        run: python scripts/update.py

      - name: Ergebnis einchecken
        run: |
          git config user.name  "kleinigkeiten-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "Keine Aenderung, nichts einzuchecken."
            exit 0
          fi
          git add data.json
          git commit -m "Stand aktualisiert: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
