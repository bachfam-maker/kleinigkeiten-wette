name: Stand aktualisieren

on:
  schedule:
    - cron: "10 5 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/manual.json"
      - "scripts/update.py"

permissions:
  contents: write

concurrency:
  group: stand
  cancel-in-progress: false

jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dateien anzeigen
        run: |
          echo "===== Inhalt des Repositories ====="
          ls -R
          echo "===== Ende ====="

      - name: Daten abrufen und rechnen
        run: python scripts/update.py

      - name: Ergebnis einchecken
        run: |
          git config user.name  "kleinigkeiten-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data.json
          if git diff --cached --quiet; then
            echo "Keine Aenderung, nichts einzuchecken."
            exit 0
          fi
          git commit -m "Stand aktualisiert: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
